document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x;margin:0;padding:0}\nhtml{scroll-behavior:smooth;scroll-padding-top:92px;-webkit-text-size-adjust:100%}\nbody{\n  font-family:'Lato',system-ui,sans-serif;\n  color:var(--ink);\n  background:var(--paper);\n  line-height:1.62;\n  font-size:17px;\n  -webkit-font-smoothing:antialiased;\n}\nh1,h2,h3,h4,.font-display{font-family:'Fredoka',sans-serif;line-height:1.1;color:var(--ink);font-weight:600}\na{color:var(--red-deep);text-decoration:none}\n.wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px}\n.eyebrow{\n  font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;\n  text-transform:uppercase;color:var(--red);display:inline-flex;align-items:center;gap:10px;\n}\n.eyebrow::before{content:\"\";width:26px;height:3px;background:var(--red);border-radius:2px;display:inline-block}\n.section{padding:96px 0}\n.section-head{max-width:780px;margin-bottom:48px}\n.section-head h2{font-size:clamp(30px,3.6vw,46px);font-weight:600;margin:18px 0 16px;letter-spacing:-.005em}\n.section-head p{font-size:18.5px;color:var(--ink-soft)}\n.lead{font-size:19px;color:var(--ink-soft)}\n.red{color:var(--red)}\n\n/* ============================== NAV ============================== */\n.nav{\n  position:sticky;top:0;z-index:60;background:var(--red);\n  transition:box-shadow .3s;\n}\n.nav.scrolled{box-shadow:0 4px 20px rgba(27,29,33,.16)}\n.nav-inner{max-width:1320px;margin:0 auto;padding:0 28px;height:80px;display:flex;align-items:center;gap:28px}\n.brand-lock{display:flex;align-items:center;gap:15px;flex-shrink:0}\n.brand-lock .logo-img{height:60px;width:60px;border-radius:8px;background:var(--logo) center/contain no-repeat}\n.brand-divider{width:1.5px;height:30px;background:rgba(255,255,255,.4)}\n.brand-name{font-family:'Fredoka',sans-serif;font-weight:600;font-size:21px;letter-spacing:.01em;color:#fff;white-space:nowrap}\n.nav-links{display:flex;gap:4px;margin-left:auto;align-items:center}\n.nav-links a{\n  font-family:'Fredoka',sans-serif;font-size:15px;font-weight:500;color:rgba(255,255,255,.86);\n  padding:9px 14px;border-radius:9px;transition:color .2s,background .2s;\n}\n.nav-links a:hover{color:#fff;background:rgba(255,255,255,.14)}\n.nav-links a.active{color:#fff;background:rgba(255,255,255,.2);font-weight:600}\n.nav-cta{\n  font-family:'Fredoka',sans-serif;font-size:15px;font-weight:600;color:var(--red-deep)!important;background:#fff;\n  padding:10px 18px;border-radius:10px;transition:transform .2s,box-shadow .2s;margin-left:8px;\n}\n.nav-cta:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.18)}\n\n/* ============================== HERO ============================== */\n.hero{position:relative;overflow:hidden;background:\n  radial-gradient(1100px 540px at 82% -12%,var(--red-soft),transparent 58%),\n  radial-gradient(620px 380px at 2% 8%,#fbf4f6,transparent 60%),\n  var(--paper);\n  border-bottom:1px solid var(--line-soft);\n}\n.hero-inner{max-width:var(--maxw);margin:0 auto;padding:80px 32px 92px;display:grid;grid-template-columns:1.12fr .88fr;gap:58px;align-items:center}\n.hero h1{font-size:clamp(46px,7vw,86px);font-weight:700;letter-spacing:-.02em;line-height:.96}\n.hero-sub{font-family:'Fredoka',sans-serif;font-weight:500;font-size:clamp(18px,2vw,22px);color:var(--ink);margin-top:18px}\n.hero-desc{font-size:18.5px;color:var(--ink-soft);margin-top:20px;max-width:545px}\n.hero-cta-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}\n.btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;padding:13px 24px;border-radius:11px;display:inline-flex;align-items:center;gap:9px;transition:transform .2s,background .2s,box-shadow .2s;cursor:pointer;border:none;white-space:nowrap}\n.btn-primary{background:var(--red);color:#fff;box-shadow:0 10px 24px -10px rgba(226,0,64,.75)}\n.btn-primary:hover{background:var(--red-deep);transform:translateY(-2px)}\n.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}\n.btn-ghost:hover{border-color:var(--red);color:var(--red-deep);transform:translateY(-2px)}\n.btn .arr{transition:transform .2s}\n.btn:hover .arr{transform:translateX(3px)}\n\n.hero-card{\n  background:var(--white);border:1px solid var(--line-soft);border-radius:18px;padding:30px;box-shadow:var(--shadow-lg);position:relative;\n}\n.hero-card::before{content:\"\";position:absolute;left:0;top:30px;bottom:30px;width:4px;border-radius:4px;background:var(--red)}\n.hero-card h4{font-family:'Fredoka',sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:4px;padding-left:14px}\n.fact-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);border-radius:12px;overflow:hidden;margin-top:18px}\n.fact{background:#fff;padding:17px 18px}\n.fact .n{font-family:'Fredoka',sans-serif;font-weight:700;font-size:28px;color:var(--ink);line-height:1}\n.fact .l{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.35}\n.fact .n small{font-size:15px;color:var(--ink-soft);font-weight:600}\n.hero-meta{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;border-top:1px solid var(--line-soft);padding-top:18px}\n.hero-meta div{display:flex;flex-direction:column;gap:3px}\n.hero-meta .k{color:var(--ink-soft);font-size:11.5px;font-family:'Fredoka',sans-serif;font-weight:500;letter-spacing:.06em;text-transform:uppercase}\n.hero-meta .v{font-weight:600;color:var(--ink);font-family:'Fredoka',sans-serif;font-size:14.5px;line-height:1.25}\n\n/* ============================== CHIPS / GENERIC ============================== */\n.chip-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}\n.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:100px;padding:7px 15px;font-family:'Fredoka',sans-serif;font-size:13.5px;font-weight:500;color:var(--ink)}\n.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}\n.chip .dot.ink{background:var(--ink)}\n\n/* ============================== PROBLEM ============================== */\n.band{background:var(--paper-2);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}\n.band-white{background:#fff}\n.problem-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:start}\n.stat-stack{display:grid;gap:18px}\n.stat-card{background:#fff;border:1px solid var(--line-soft);border-left:4px solid var(--red);border-radius:12px;padding:22px 24px}\n.stat-card h4{font-family:'Fredoka',sans-serif;font-size:18px;font-weight:600;margin-bottom:6px}\n.stat-card p{font-size:15.5px;color:var(--ink-soft);margin:0}\n.problem-points{display:grid;gap:22px}\n.ppoint{display:flex;gap:16px}\n.ppoint .ico{flex-shrink:0;width:44px;height:44px;border-radius:12px;background:var(--red-soft);color:var(--red-deep);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:700;font-size:19px}\n.ppoint h4{font-family:'Fredoka',sans-serif;font-size:18px;font-weight:600;margin-bottom:4px}\n.ppoint p{font-size:15.5px;color:var(--ink-soft);margin:0}\n\n/* ============================== CONCEPT ============================== */\n.concept-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:8px}\n.def-card{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r);padding:32px;box-shadow:var(--shadow);position:relative;overflow:hidden}\n.def-card .tag{font-family:'Fredoka',sans-serif;font-weight:600;font-size:13.5px;letter-spacing:.04em;color:#fff;background:var(--red);display:inline-block;padding:6px 13px;border-radius:8px;margin-bottom:16px}\n.def-card.coms .tag{background:var(--ink)}\n.def-card h3{font-size:23px;font-weight:600;margin-bottom:10px}\n.def-card p{color:var(--ink-soft);font-size:16px}\n.def-card .abbr{font-family:'Fredoka',sans-serif;font-size:58px;font-weight:700;color:var(--paper-2);position:absolute;right:22px;top:18px;letter-spacing:-.02em;z-index:0;line-height:1}\n.def-card>*{position:relative;z-index:1}\n\n.tracks{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:30px}\n.track{border-radius:var(--r);padding:30px;border:1px solid var(--line-soft)}\n.track.adults{background:linear-gradient(180deg,var(--red-soft),transparent);border-color:var(--red-tint)}\n.track.children{background:linear-gradient(180deg,#ececed,transparent);border-color:#dededf}\n.track .label{display:flex;align-items:center;gap:10px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;margin-bottom:8px}\n.track .pill{font-size:12.5px;font-weight:600;font-family:'Fredoka',sans-serif;padding:3px 11px;border-radius:100px;color:#fff}\n.track.adults .pill{background:var(--red)}\n.track.children .pill{background:var(--ink)}\n.track h3{font-size:20px;font-weight:600;margin-bottom:6px}\n.track p{font-size:15px;color:var(--ink-soft)}\n\n/* ============================== METHODOLOGY / FLOW ============================== */\n.flow-section{background:var(--dark);color:#ececed;position:relative;overflow:hidden}\n.flow-section::before{content:\"\";position:absolute;inset:0;background:radial-gradient(900px 520px at 88% -5%,rgba(226,0,64,.28),transparent 56%),radial-gradient(680px 400px at 0% 105%,rgba(226,0,64,.10),transparent 55%);pointer-events:none}\n.flow-section .wrap{position:relative;z-index:1}\n.flow-section .eyebrow{color:#ff7d9d}\n.flow-section .eyebrow::before{background:var(--red)}\n.flow-section .section-head h2{color:#fff}\n.flow-section .section-head p{color:#b6b8bd}\n\n.phase{margin-top:46px}\n.phase-head{display:flex;align-items:baseline;gap:16px;margin-bottom:22px;flex-wrap:wrap}\n.phase-num{font-family:'Fredoka',sans-serif;font-weight:600;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--red);padding:6px 13px;border-radius:8px;white-space:nowrap}\n.phase.b .phase-num{background:#fff;color:var(--ink)}\n.phase-head h3{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:600;color:#fff}\n.phase-head .res{margin-left:auto;font-family:'Fredoka',sans-serif;font-size:13.5px;font-weight:500;color:#d8dade;display:flex;align-items:center;gap:8px}\n.phase-head .res .star{color:var(--red);font-size:15px}\n.phase.b .phase-head .res .star{color:#fff}\n\n.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}\n.step{\n  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:18px 18px 20px;\n  position:relative;transition:transform .25s,background .25s,border-color .25s;\n}\n.step:hover{transform:translateY(-4px);background:rgba(226,0,64,.16);border-color:rgba(226,0,64,.55)}\n.step .sn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;color:#fff;background:var(--red);width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}\n.phase.b .step .sn{background:#fff;color:var(--ink)}\n.step h4{font-family:'Fredoka',sans-serif;font-size:16px;font-weight:600;color:#fff;margin-bottom:6px;line-height:1.22}\n.step p{font-size:13.5px;color:#b6b8bd;margin:0;line-height:1.45}\n.step.split{background:linear-gradient(120deg,rgba(226,0,64,.18),rgba(255,255,255,.07));border-color:rgba(255,255,255,.2)}\n.step .splittags{display:flex;gap:6px;margin-top:11px}\n.step .splittags span{font-family:'Fredoka',sans-serif;font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px}\n.step .splittags .a{background:rgba(226,0,64,.28);color:#ffc2d0}\n.step .splittags .c{background:rgba(255,255,255,.16);color:#e6e7e9}\n\n.flow-bridge{display:flex;align-items:center;gap:16px;margin:30px 0;padding:18px 24px;background:linear-gradient(90deg,rgba(226,0,64,.18),rgba(226,0,64,.04));border:1px solid rgba(226,0,64,.45);border-radius:13px}\n.flow-bridge.neutral{background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.02));border-color:rgba(255,255,255,.22)}\n.flow-bridge .badge{font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--red-deep);padding:7px 14px;border-radius:9px;flex-shrink:0}\n.flow-bridge.neutral .badge{background:rgba(255,255,255,.16)}\n.flow-bridge p{margin:0;font-size:15px;color:#d2d4d8}\n.flow-bridge p strong{color:#fff}\n\n.flow-final{margin-top:30px;display:flex;align-items:center;justify-content:center;gap:14px;font-family:'Fredoka',sans-serif;font-weight:500;font-size:16.5px;color:#f0f0f1;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.24);border-radius:13px;padding:18px;text-align:center}\n.flow-final .star{font-size:19px}\n\n/* ============================== THRESHOLDS / SCALE ============================== */\n.scale-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}\n.grade-bar{display:flex;border-radius:13px;overflow:hidden;border:1px solid var(--line);margin-top:10px;box-shadow:var(--shadow)}\n.grade-seg{flex:1;padding:20px 16px;text-align:center;color:#fff}\n.grade-seg .rng{font-family:'Fredoka',sans-serif;font-weight:700;font-size:23px}\n.grade-seg .nm{font-family:'Fredoka',sans-serif;font-size:13.5px;font-weight:500;margin-top:4px;opacity:.96}\n.g1{background:#c9c6c8;color:#4a4d52}\n.g2{background:#ef6f8c}\n.g3{background:var(--red)}\n.scale-note{font-size:14.5px;color:var(--ink-soft);margin-top:16px}\n.thr-cards{display:grid;gap:14px}\n.thr{display:flex;align-items:center;gap:20px;background:#fff;border:1px solid var(--line-soft);border-radius:13px;padding:18px 22px;box-shadow:var(--shadow)}\n.thr .pct{font-family:'Fredoka',sans-serif;font-weight:700;font-size:31px;flex-shrink:0;width:98px;text-align:center}\n.thr.inc .pct{color:var(--red-deep)}\n.thr.exc .pct{color:#7c8088}\n.thr .txt h4{font-family:'Fredoka',sans-serif;font-size:16.5px;font-weight:600;margin-bottom:2px}\n.thr .txt p{font-size:14px;color:var(--ink-soft);margin:0}\n.thr .vrule{width:1px;align-self:stretch;background:var(--line-soft)}\n\n/* ============================== PARTICIPANTS ============================== */\n.stake-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:8px}\n.stake{background:#fff;border:1px solid var(--line-soft);border-radius:13px;padding:24px 22px;transition:transform .2s,box-shadow .2s}\n.stake:hover{transform:translateY(-3px);box-shadow:var(--shadow)}\n.stake .ico{width:44px;height:44px;border-radius:12px;background:var(--red-soft);color:var(--red-deep);display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-weight:700;font-family:'Fredoka',sans-serif;font-size:20px}\n.stake h4{font-family:'Fredoka',sans-serif;font-size:16.5px;font-weight:600;margin-bottom:5px}\n.stake p{font-size:13.5px;color:var(--ink-soft);margin:0;line-height:1.45}\n\n/* ============================== TIMELINE ============================== */\n.timeline{position:relative;margin-top:18px}\n.tl-track{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}\n.tl-track::before{content:\"\";position:absolute;top:23px;left:6%;right:6%;height:3px;background:var(--red-tint)}\n.tl-item{text-align:center;padding:0 16px;position:relative}\n.tl-node{width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid var(--red);color:var(--red-deep);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;margin:0 auto 16px;position:relative;z-index:1}\n.tl-item:last-child .tl-node{border-color:var(--ink);color:var(--ink)}\n.tl-item h4{font-family:'Fredoka',sans-serif;font-size:17px;font-weight:600;margin-bottom:5px}\n.tl-item .mo{font-family:'Fredoka',sans-serif;font-size:12.5px;font-weight:600;color:var(--red-deep);letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}\n.tl-item p{font-size:13.5px;color:var(--ink-soft);margin:0}\n\n/* ============================== TEAM ============================== */\n.team-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:48px}\n.lead-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}\n.lead-card{background:#fff;border:1px solid var(--line-soft);border-radius:13px;padding:24px;box-shadow:var(--shadow);border-top:4px solid var(--red)}\n.lead-card .role{font-family:'Fredoka',sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--red-deep);font-weight:600}\n.lead-card .nm{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:600;margin:8px 0 3px}\n.lead-card .aff{font-size:14px;color:var(--ink-soft)}\n.role-list{display:grid;gap:0}\n.role-list .rl{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line-soft)}\n.role-list .rl:last-child{border-bottom:none}\n.role-list .rl .k{font-family:'Fredoka',sans-serif;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;flex-shrink:0;width:130px;padding-top:2px}\n.role-list .rl .v{font-size:15px;color:var(--ink);text-align:right}\n.committee{background:#fff;border:1px solid var(--line-soft);border-radius:var(--r);padding:30px 32px}\n.committee h4{font-family:'Fredoka',sans-serif;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--red-deep);font-weight:600;margin-bottom:16px}\n.committee ul{list-style:none;display:grid;gap:13px}\n.committee li{font-size:15px;display:flex;gap:11px;align-items:flex-start}\n.committee li::before{content:\"\";width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:8px;flex-shrink:0}\n.committee li b{font-family:'Fredoka',sans-serif;font-weight:600}\n.committee li span{color:var(--ink-soft);font-size:13.5px}\n\n.funders{margin-top:40px;border-top:1px solid var(--line);padding-top:34px}\n.funders .lbl{font-family:'Fredoka',sans-serif;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:18px}\n.funder-row{display:flex;flex-wrap:wrap;gap:14px}\n.funder{flex:1;min-width:190px;background:#fff;border:1px solid var(--line-soft);border-radius:13px;padding:20px 22px;border-bottom:3px solid var(--red)}\n.funder .ft{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;color:var(--ink)}\n.funder .fs{font-size:13px;color:var(--ink-soft);margin-top:3px}\n\n/* ============================== FOOTER ============================== */\n.footer{background:var(--dark);color:#bcbec3;padding:64px 0 40px}\n.footer-top{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:40px;padding-bottom:40px;border-bottom:1px solid rgba(255,255,255,.1)}\n.footer h4{font-family:'Fredoka',sans-serif;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:#ff7d9d;font-weight:600;margin-bottom:16px}\n.footer .ft-brand{display:flex;align-items:center;gap:14px;margin-bottom:14px}\n.footer .ft-brand .logo-img{height:48px;width:48px;border-radius:8px;background:var(--logo) center/contain no-repeat}\n.footer .ft-brand .nm{font-family:'Fredoka',sans-serif;font-weight:600;font-size:24px;color:#fff}\n.footer p{font-size:14.5px;color:#9a9ca2;max-width:350px}\n.footer .ft-links{display:grid;gap:10px}\n.footer .ft-links a{color:#bcbec3;font-size:14.5px}\n.footer .ft-links a:hover{color:#fff}\n.footer-bottom{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-top:26px;font-size:13px;color:#7e8086}\n.footer-bottom .lic{display:flex;align-items:center;gap:8px}\n\n/* ============================== REVEAL ANIM ============================== */\n.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}\n.reveal.in{opacity:1;transform:none}\n@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}\n\n/* ============================== RESPONSIVE ============================== */\n@media(max-width:980px){\n  .hero-inner{grid-template-columns:1fr;gap:40px}\n  .problem-grid,.scale-grid,.team-grid{grid-template-columns:1fr;gap:36px}\n  .concept-grid,.tracks,.lead-row{grid-template-columns:1fr}\n  .steps{grid-template-columns:repeat(2,1fr)}\n  .stake-grid{grid-template-columns:repeat(2,1fr)}\n  .tl-track{grid-template-columns:1fr;gap:24px}\n  .tl-track::before{display:none}\n  .footer-top{grid-template-columns:1fr;gap:30px}\n}\n@media(max-width:680px){\n  body{font-size:16px}\n  .wrap{padding:0 22px}\n  .section{padding:64px 0}\n  .nav-links{display:none}\n  .nav-inner{height:68px}\n  .brand-lock .logo-img{height:48px;width:48px}\n  .hero-inner{padding:54px 22px 64px}\n  .steps{grid-template-columns:1fr}\n  .stake-grid{grid-template-columns:1fr}\n  .grade-bar{flex-direction:column}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ============================== NAV ============================== -->\n<nav class=\"nav\" id=\"nav\">\n  <div class=\"nav-inner\">\n    <div class=\"brand-lock\">\n      <span class=\"logo-img\" role=\"img\" aria-label=\"ISARIC\"><\u002Fspan>\n      <div class=\"brand-divider\"><\u002Fdiv>\n      <div class=\"brand-name\">FLU-CORE<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"nav-links\" id=\"navLinks\">\n      <a href=\"#overview\">Overview<\u002Fa>\n      <a href=\"#problem\">The Problem<\u002Fa>\n      <a href=\"#concept\">Concept<\u002Fa>\n      <a href=\"#methodology\">Methodology<\u002Fa>\n      <a href=\"#consensus\">Consensus<\u002Fa>\n      <a href=\"#timeline\">Timeline<\u002Fa>\n      <a href=\"#team\">Team<\u002Fa>\n      <a class=\"nav-cta\" href=\"https://www.comet-initiative.org/Studies/Details/3714\" target=\"_blank\" rel=\"noopener\">Study Registry ↗<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- ============================== HERO ============================== -->\n<header class=\"hero\" id=\"overview\" data-screen-label=\"Hero\">\n  <div class=\"hero-inner\">\n    <div class=\"hero-copy reveal\">\n      <span class=\"eyebrow\">Influenza Core Outcome Set · Delphi consensus project<\u002Fspan>\n      <h1>FLU-<span class=\"red\">CORE<\u002Fspan><\u002Fh1>\n      <p class=\"hero-sub\">Agreeing on what to measure — and how — in influenza clinical trials worldwide.<\u002Fp>\n      <p class=\"hero-desc\">An international, multi-stakeholder consensus project developing a <strong>Core Outcome Set<\u002Fstrong> for influenza: the minimum set of outcomes that every flu trial should measure and report, chosen together by patients, carers, clinicians, researchers and policymakers.<\u002Fp>\n      <div class=\"hero-cta-row\">\n        <a class=\"btn btn-primary\" href=\"#concept\">Explore the concept <span class=\"arr\">→<\u002Fspan><\u002Fa>\n        <a class=\"btn btn-ghost\" href=\"#methodology\">See the methodology<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"chip-row\">\n        <span class=\"chip\"><span class=\"dot\"><\u002Fspan>Modified Delphi consensus<\u002Fspan>\n        <span class=\"chip\"><span class=\"dot\"><\u002Fspan>Adults track<\u002Fspan>\n        <span class=\"chip\"><span class=\"dot ink\"><\u002Fspan>Children 0–17 track<\u002Fspan>\n        <span class=\"chip\"><span class=\"dot\"><\u002Fspan>Open · global · online<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <aside class=\"hero-card reveal\">\n      <h4>Project at a glance<\u002Fh4>\n      <div class=\"fact-grid\">\n        <div class=\"fact\"><div class=\"n\">24<small> mo<\u002Fsmall><\u002Fdiv><div class=\"l\">Expected duration of the consensus process<\u002Fdiv><\u002Fdiv>\n        <div class=\"fact\"><div class=\"n\">2<\u002Fdiv><div class=\"l\">Parallel core outcome sets — adults &amp; children<\u002Fdiv><\u002Fdiv>\n        <div class=\"fact\"><div class=\"n\">40–60<\u002Fdiv><div class=\"l\">Invited Delphi panellists, globally balanced<\u002Fdiv><\u002Fdiv>\n        <div class=\"fact\"><div class=\"n\">2×2<\u002Fdiv><div class=\"l\">Delphi rounds — for outcomes, then instruments<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hero-meta\">\n        <div><span class=\"k\">Study design<\u002Fspan><span class=\"v\">Modified Delphi consensus<\u002Fspan><\u002Fdiv>\n        <div><span class=\"k\">Sponsor<\u002Fspan><span class=\"v\">King's College London<\u002Fspan><\u002Fdiv>\n        <div><span class=\"k\">Coordination<\u002Fspan><span class=\"v\">ISARIC · University of Oxford<\u002Fspan><\u002Fdiv>\n        <div><span class=\"k\">Version<\u002Fspan><span class=\"v\">Protocol v1.0 · 05 May 2026<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ============================== THE PROBLEM ============================== -->\n<section class=\"section band-white\" id=\"problem\" data-screen-label=\"The Problem\">\n  <div class=\"wrap problem-grid\">\n    <div class=\"reveal\">\n      <span class=\"eyebrow\">Background &amp; rationale<\u002Fspan>\n      <h2 style=\"font-size:clamp(28px,3.4vw,42px);font-weight:600;margin:18px 0 16px\">Influenza trials don't measure the same things<\u002Fh2>\n      <p class=\"lead\">Influenza is highly prevalent, yet flu studies vary enormously in <em>which<\u002Fem> outcomes they report and <em>how<\u002Fem> they measure them. That heterogeneity makes results hard to compare, combine, or trust — fragmenting our understanding of which treatments actually work.<\u002Fp>\n      <div class=\"stat-stack\" style=\"margin-top:26px\">\n        <div class=\"stat-card\"><h4>Inconsistent outcomes<\u002Fh4><p>Clinical trials use widely differing endpoints and measurement instruments, limiting meta-analysis and systematic review.<\u002Fp><\u002Fdiv>\n        <div class=\"stat-card\"><h4>Patient voice missing<\u002Fh4><p>The outcomes that matter most to people with lived experience and their carers are too often left out of trial design.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"problem-points reveal\">\n      <div class=\"ppoint\"><div class=\"ico\">✓<\u002Fdiv><div><h4>A shared minimum standard<\u002Fh4><p>A Core Outcome Set defines the small set of <strong>“core”<\u002Fstrong> outcomes that should be measured and reported in <em>every<\u002Fem> influenza trial.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"ppoint\"><div class=\"ico\">⤢<\u002Fdiv><div><h4>Comparable, combinable evidence<\u002Fh4><p>Consistency makes it far easier to pool results across studies — strengthening meta-analyses, reviews and guideline development.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"ppoint\"><div class=\"ico\">◎<\u002Fdiv><div><h4>Built by everyone involved<\u002Fh4><p>Outcomes are selected by a broad coalition — patients, carers, clinicians, researchers, regulators and policymakers alike.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"ppoint\"><div class=\"ico\">♥<\u002Fdiv><div><h4>Minimal risk, significant benefit<\u002Fh4><p>Participation is a series of optional online surveys and meetings, supporting better-designed trials and clearer clinical decisions.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================== CONCEPT ============================== -->\n<section class=\"section band\" id=\"concept\" data-screen-label=\"Concept\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">The concept<\u002Fspan>\n      <h2>From a long list of outcomes to an agreed core<\u002Fh2>\n      <p>FLU-CORE produces two complementary, consensus-built standards — first <em>what<\u002Fem> to measure, then <em>how<\u002Fem> to measure it.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"concept-grid\">\n      <div class=\"def-card reveal\">\n        <span class=\"abbr\">COS<\u002Fspan>\n        <span class=\"tag\">Core Outcome Set<\u002Fspan>\n        <h3>The <em>what<\u002Fem><\u002Fh3>\n        <p>An agreed, minimal set of the most critical outcomes that should be measured and reported in all influenza clinical trials — so the most important effects on people are never overlooked.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"def-card coms reveal\">\n        <span class=\"abbr\">COMS<\u002Fspan>\n        <span class=\"tag\">Core Outcome Measurement Set<\u002Fspan>\n        <h3>The <em>how<\u002Fem><\u002Fh3>\n        <p>For each core outcome, the valid, reliable and feasible measurement instrument(s) the field agrees should be used — assessed against COSMIN guidelines.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"reveal\" style=\"margin-top:46px\">\n      <h3 style=\"font-size:24px;font-weight:600;margin-bottom:6px\">Two populations, two parallel sets<\u002Fh3>\n      <p class=\"lead\" style=\"max-width:680px\">The protocol develops two separate Core Outcome Sets, run in parallel through the same rigorous process.<\u002Fp>\n      <div class=\"tracks\">\n        <div class=\"track adults\">\n          <div class=\"label\"><span class=\"pill\">Track A<\u002Fspan> Adults<\u002Fdiv>\n          <h3>Influenza in adults (≥18)<\u002Fh3>\n          <p>Lived-experience adults, family carers, and professionals with clinical, research, regulatory or policy expertise in adult influenza.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"track children\">\n          <div class=\"label\"><span class=\"pill\">Track B<\u002Fspan> Children<\u002Fdiv>\n          <h3>Influenza in children (0–17)<\u002Fh3>\n          <p>Young people (16+) with lived experience, carers of under-18s, and professionals working with influenza in children and young people.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================== METHODOLOGY / FLOW ============================== -->\n<section class=\"section flow-section\" id=\"methodology\" data-screen-label=\"Methodology\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Methodology<\u002Fspan>\n      <h2>How consensus is reached<\u002Fh2>\n      <p>A systematic, inclusive sequence — combining evidence review, patient &amp; public involvement, an open survey, and a modified online Delphi, finalised in a moderated consensus meeting.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- PHASE A -->\n    <div class=\"phase a reveal\">\n      <div class=\"phase-head\">\n        <span class=\"phase-num\">Phase 1<\u002Fspan>\n        <h3>Define the core outcomes<\u002Fh3>\n        <span class=\"res\"><span class=\"star\">★<\u002Fspan> Result: Core Outcome Set (COS)<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"steps\">\n        <div class=\"step\"><div class=\"sn\">1<\u002Fdiv><h4>Scoping review<\u002Fh4><p>Mine published trials &amp; registered protocols for every outcome reported — building one long list.<\u002Fp><\u002Fdiv>\n        <div class=\"step\"><div class=\"sn\">2<\u002Fdiv><h4>Expert review + PPIE<\u002Fh4><p>Specialists and patient/public partners consolidate and reword outcomes into a clear shortlist.<\u002Fp><\u002Fdiv>\n        <div class=\"step\"><div class=\"sn\">3<\u002Fdiv><h4>Open survey<\u002Fh4><p>Anyone affected by flu rates the shortlist worldwide, in multiple languages, informing the Delphi.<\u002Fp><\u002Fdiv>\n        <div class=\"step split\"><div class=\"sn\">4<\u002Fdiv><h4>Delphi · Round 1<\u002Fh4><p>Panellists score each outcome and suggest additions.<\u002Fp><div class=\"splittags\"><span class=\"a\">Adults<\u002Fspan><span class=\"c\">Children<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"flow-bridge\">\n        <span class=\"badge\">Between rounds<\u002Fspan>\n        <p><strong>Review new suggestions.<\u002Fstrong> Outcomes proposed by ≥5% of participants are assessed by investigators &amp; the Steering Committee for inclusion in Round 2.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"steps\" style=\"grid-template-columns:repeat(2,1fr)\">\n        <div class=\"step split\"><div class=\"sn\">5<\u002Fdiv><h4>Delphi · Round 2<\u002Fh4><p>Panellists re-score the full list — now seeing their own Round 1 score and each stakeholder group's distribution.<\u002Fp><div class=\"splittags\"><span class=\"a\">Adults<\u002Fspan><span class=\"c\">Children<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"step\"><div class=\"sn\">6<\u002Fdiv><h4>Consensus meeting<\u002Fh4><p>A moderated virtual / hybrid meeting resolves outcomes that didn't meet thresholds — finalising the COS.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"flow-final reveal\"><span class=\"star red\">★<\u002Fspan> Core Outcome Set (COS) finalised — the agreed list of <em>what<\u002Fem> to measure<\u002Fdiv>\n\n    <!-- PHASE B -->\n    <div class=\"phase b reveal\" style=\"margin-top:54px\">\n      <div class=\"phase-head\">\n        <span class=\"phase-num\">Phase 2<\u002Fspan>\n        <h3>Define how to measure them<\u002Fh3>\n        <span class=\"res\"><span class=\"star\">★<\u002Fspan> Result: Core Outcome Measurement Set (COMS)<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"steps\">\n        <div class=\"step\"><div class=\"sn\">7<\u002Fdiv><h4>Map instruments<\u002Fh4><p>A literature review maps candidate measurement instruments to each agreed core outcome.<\u002Fp><\u002Fdiv>\n        <div class=\"step\"><div class=\"sn\">8<\u002Fdiv><h4>Expert review<\u002Fh4><p>Experts assess validity, reliability &amp; feasibility (per COSMIN) and approve instruments for an expert Delphi.<\u002Fp><\u002Fdiv>\n        <div class=\"step\"><div class=\"sn\">9<\u002Fdiv><h4>Expert Delphi · R1 &amp; R2<\u002Fh4><p>Participants score instruments per outcome over two anonymised rounds, recommending alternatives.<\u002Fp><\u002Fdiv>\n        <div class=\"step\"><div class=\"sn\">10<\u002Fdiv><h4>Consensus workshop<\u002Fh4><p>Final selection of the measurement instrument(s) for each core outcome.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"flow-bridge neutral\">\n        <span class=\"badge\">Note<\u002Fspan>\n        <p>Additional Delphi rounds or meetings may be added depending on the complexity of the outcomes and instruments selected.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"flow-final reveal\"><span class=\"star\" style=\"color:#fff\">★<\u002Fspan> Core Outcome Measurement Set (COMS) finalised — then <strong>disseminated worldwide<\u002Fstrong><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================== CONSENSUS / THRESHOLDS ============================== -->\n<section class=\"section\" id=\"consensus\" data-screen-label=\"Consensus\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Rating &amp; consensus<\u002Fspan>\n      <h2>How importance is scored — and what counts as agreement<\u002Fh2>\n      <p>Outcomes are rated on the GRADE 9-point scale. Pre-defined thresholds, applied across <em>all<\u002Fem> stakeholder groups, decide what enters the core set.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"scale-grid\">\n      <div class=\"reveal\">\n        <h3 style=\"font-size:21px;font-weight:600;margin-bottom:4px\">The GRADE 9-point scale<\u002Fh3>\n        <p style=\"color:var(--ink-soft);font-size:15.5px\">Each outcome is rated 1–9, grouped into three bands of importance.<\u002Fp>\n        <div class=\"grade-bar\">\n          <div class=\"grade-seg g1\"><div class=\"rng\">1–3<\u002Fdiv><div class=\"nm\">Not important<\u002Fdiv><\u002Fdiv>\n          <div class=\"grade-seg g2\"><div class=\"rng\">4–6<\u002Fdiv><div class=\"nm\">Important<\u002Fdiv><\u002Fdiv>\n          <div class=\"grade-seg g3\"><div class=\"rng\">7–9<\u002Fdiv><div class=\"nm\">Critical<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"scale-note\">In the open survey, participants are randomly assigned a 3-, 6- or 9-point scale — a built-in sub-study evaluating how rating-scale design affects responses. Only participants who rate at least <strong>50%<\u002Fstrong> of items are included in the analysis.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\">\n        <h3 style=\"font-size:21px;font-weight:600;margin-bottom:14px\">Consensus thresholds<\u002Fh3>\n        <div class=\"thr-cards\">\n          <div class=\"thr inc\"><div class=\"pct\">≥80%<\u002Fdiv><div class=\"vrule\"><\u002Fdiv><div class=\"txt\"><h4>Outcome included<\u002Fh4><p>Rated “critical” by ≥80% of participants in <em>all<\u002Fem> stakeholder groups after Round 2.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"thr exc\"><div class=\"pct\">≤50%<\u002Fdiv><div class=\"vrule\"><\u002Fdiv><div class=\"txt\"><h4>Outcome excluded<\u002Fh4><p>Rated “critical” by ≤50% across all stakeholder groups. Anything in between goes to the consensus meeting.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <div class=\"thr inc\"><div class=\"pct\">≥70%<\u002Fdiv><div class=\"vrule\"><\u002Fdiv><div class=\"txt\"><h4>Instrument included<\u002Fh4><p>A measurement instrument enters the COMS when ≥70% of voting participants rate it critically important.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"scale-note\">Responses from participants employed by for-profit industry inform discussion but are excluded from the final consensus tally.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================== PARTICIPANTS ============================== -->\n<section class=\"section band\" id=\"participants\" data-screen-label=\"Participants\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Who takes part<\u002Fspan>\n      <h2>An inclusive, global coalition<\u002Fh2>\n      <p>Recruited openly through professional networks, the influenza literature, social media and the ISARIC website — by snowball and convenience sampling, across many countries and languages.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"stake-grid\">\n      <div class=\"stake reveal\"><div class=\"ico\">♥<\u002Fdiv><h4>Patients &amp; carers<\u002Fh4><p>People with lived experience of influenza and the family members who cared for or advocated for them.<\u002Fp><\u002Fdiv>\n      <div class=\"stake reveal\"><div class=\"ico\">✚<\u002Fdiv><h4>Health professionals<\u002Fh4><p>Clinicians with expertise in treating or caring for people with influenza.<\u002Fp><\u002Fdiv>\n      <div class=\"stake reveal\"><div class=\"ico\">⚗<\u002Fdiv><h4>Researchers<\u002Fh4><p>Those who design, conduct, oversee or fund influenza research and clinical trials.<\u002Fp><\u002Fdiv>\n      <div class=\"stake reveal\"><div class=\"ico\">§<\u002Fdiv><h4>Policy &amp; regulators<\u002Fh4><p>People developing policy or regulating influenza research, ensuring outcomes are decision-relevant.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================== TIMELINE ============================== -->\n<section class=\"section\" id=\"timeline\" data-screen-label=\"Timeline\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Timeline<\u002Fspan>\n      <h2>A 24-month consensus journey<\u002Fh2>\n      <p>An indicative sequence — participants may join throughout the study period as each phase runs.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"timeline reveal\">\n      <div class=\"tl-track\">\n        <div class=\"tl-item\"><div class=\"tl-node\">1<\u002Fdiv><div class=\"mo\">Months 1–6<\u002Fdiv><h4>Evidence &amp; shortlist<\u002Fh4><p>Scoping review, expert classification and PPIE refine the candidate outcomes.<\u002Fp><\u002Fdiv>\n        <div class=\"tl-item\"><div class=\"tl-node\">2<\u002Fdiv><div class=\"mo\">Months 6–10<\u002Fdiv><h4>Open survey<\u002Fh4><p>Global, multilingual rating of the shortlist opens the process to all stakeholders.<\u002Fp><\u002Fdiv>\n        <div class=\"tl-item\"><div class=\"tl-node\">3<\u002Fdiv><div class=\"mo\">Months 10–18<\u002Fdiv><h4>Delphi &amp; consensus<\u002Fh4><p>Two Delphi rounds plus a moderated meeting finalise the Core Outcome Set.<\u002Fp><\u002Fdiv>\n        <div class=\"tl-item\"><div class=\"tl-node\">4<\u002Fdiv><div class=\"mo\">Months 18–24<\u002Fdiv><h4>Instruments &amp; sharing<\u002Fh4><p>Measurement instruments agreed and results disseminated worldwide.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================== TEAM ============================== -->\n<section class=\"section band-white\" id=\"team\" data-screen-label=\"Team\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Team &amp; governance<\u002Fspan>\n      <h2>Who is leading FLU-CORE<\u002Fh2>\n      <p>Coordinated by ISARIC on behalf of the University of Oxford, with an international Steering Committee overseeing design and delivery.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"team-grid\">\n      <div class=\"reveal\">\n        <div class=\"lead-row\">\n          <div class=\"lead-card\"><div class=\"role\">Chief Investigator<\u002Fdiv><div class=\"nm\">Daniel Munblit<\u002Fdiv><div class=\"aff\">King's College London<\u002Fdiv><\u002Fdiv>\n          <div class=\"lead-card\"><div class=\"role\">Chief Investigator<\u002Fdiv><div class=\"nm\">Luis Felipe Reyes<\u002Fdiv><div class=\"aff\">University of Oxford<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"role-list\">\n          <div class=\"rl\"><div class=\"k\">Coordinator<\u002Fdiv><div class=\"v\">Anastasiia Demidova · King's College London<\u002Fdiv><\u002Fdiv>\n          <div class=\"rl\"><div class=\"k\">Analyst<\u002Fdiv><div class=\"v\">Ousmane Tapsirou Ly · ISARIC<\u002Fdiv><\u002Fdiv>\n          <div class=\"rl\"><div class=\"k\">Sponsor<\u002Fdiv><div class=\"v\">King's College London<\u002Fdiv><\u002Fdiv>\n          <div class=\"rl\"><div class=\"k\">Investigators<\u002Fdiv><div class=\"v\">Emma Gregory · Hei To Ho · Aman Rashid · Archawin Udomrat · Muneeb Javed<\u002Fdiv><\u002Fdiv>\n          <div class=\"rl\"><div class=\"k\">Registration<\u002Fdiv><div class=\"v\"><a href=\"https://www.comet-initiative.org/Studies/Details/3714\" target=\"_blank\" rel=\"noopener\">COMET Initiative #3714 ↗<\u002Fa><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"committee reveal\">\n        <h4>Steering Committee<\u002Fh4>\n        <ul>\n          <li><div><b>Srinivas Murthy<\u002Fb><br><span>University of British Columbia, Canada<\u002Fspan><\u002Fdiv><\u002Fli>\n          <li><div><b>François Lamontagne<\u002Fb><br><span>Université de Sherbrooke, Canada<\u002Fspan><\u002Fdiv><\u002Fli>\n          <li><div><b>Dale Needham<\u002Fb><br><span>Johns Hopkins University, United States<\u002Fspan><\u002Fdiv><\u002Fli>\n          <li><div><b>Timothy M. Uyeki<\u002Fb><br><span>Centers for Disease Control and Prevention, United States<\u002Fspan><\u002Fdiv><\u002Fli>\n          <li><div><b>Elizabeth A. Whittaker<\u002Fb><br><span>Imperial College London, United Kingdom<\u002Fspan><\u002Fdiv><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"funders reveal\">\n      <div class=\"lbl\">Funded by<\u002Fdiv>\n      <div class=\"funder-row\">\n        <div class=\"funder\"><div class=\"ft\">Bill &amp; Melinda Gates Foundation<\u002Fdiv><div class=\"fs\">Seattle, United States<\u002Fdiv><\u002Fdiv>\n        <div class=\"funder\"><div class=\"ft\">Wellcome Trust<\u002Fdiv><div class=\"fs\">London, United Kingdom<\u002Fdiv><\u002Fdiv>\n        <div class=\"funder\"><div class=\"ft\">UK Foreign, Commonwealth &amp; Development Office<\u002Fdiv><div class=\"fs\">London, United Kingdom<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================== FOOTER ============================== -->\n<footer class=\"footer\">\n  <div class=\"wrap\">\n    <div class=\"footer-top\">\n      <div>\n        <div class=\"ft-brand\"><span class=\"logo-img\" role=\"img\" aria-label=\"ISARIC\"><\u002Fspan><span class=\"nm\">FLU-CORE<\u002Fspan><\u002Fdiv>\n        <p>Influenza Core Outcome Set — a Delphi consensus project developing the outcomes that every influenza clinical trial should measure, and how.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h4>Project<\u002Fh4>\n        <div class=\"ft-links\">\n          <a href=\"#concept\">The concept<\u002Fa>\n          <a href=\"#methodology\">Methodology<\u002Fa>\n          <a href=\"#consensus\">Consensus thresholds<\u002Fa>\n          <a href=\"#team\">Team &amp; governance<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <h4>Find out more<\u002Fh4>\n        <div class=\"ft-links\">\n          <a href=\"https://www.comet-initiative.org/Studies/Details/3714\" target=\"_blank\" rel=\"noopener\">COMET registry #3714 ↗<\u002Fa>\n          <a href=\"https://isaric.org\" target=\"_blank\" rel=\"noopener\">ISARIC ↗<\u002Fa>\n          <a href=\"mailto:daniel.munblit@kcl.ac.uk\">Contact the investigators<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer-bottom\">\n      <div class=\"lic\">Licensed CC BY-SA 4.0 by ISARIC on behalf of the University of Oxford · Protocol v1.0 · 05 May 2026<\u002Fdiv>\n      <div>© 2026 FLU-CORE / ISARIC<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\nconst nav=document.getElementById('nav');\naddEventListener('scroll',()=>{nav.classList.toggle('scrolled',scrollY>10)},{passive:true});\n\nconst io=new IntersectionObserver((es)=>{\n  es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}});\n},{threshold:.12,rootMargin:'0px 0px -8% 0px'});\ndocument.querySelectorAll('.reveal').forEach(el=>io.observe(el));\n\nconst links=[...document.querySelectorAll('.nav-links a[href^=\"#\"]')];\nconst map=new Map(links.map(a=>[a.getAttribute('href').slice(1),a]));\nconst secs=[...map.keys()].map(id=>document.getElementById(id)).filter(Boolean);\nconst spy=new IntersectionObserver((es)=>{\n  es.forEach(e=>{\n    if(e.isIntersecting){\n      links.forEach(a=>a.classList.remove('active'));\n      const a=map.get(e.target.id); if(a)a.classList.add('active');\n    }\n  });\n},{threshold:.4,rootMargin:'-40% 0px -55% 0px'});\nsecs.forEach(s=>spy.observe(s));\n<\u002Fscript>\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
